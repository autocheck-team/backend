syntax = "proto3";

package autocheck.v1;

import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Autocheck API"
    version: "1.0"
    description: "Автоматическая проверка программных решений студентов."
  }
  security_definitions: {
    security: {
      key: "bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access-токен Keycloak: `Bearer <token>`"
      }
    }
  }
  security: {
    security_requirement: {key: "bearer"}
  }
};

// UserService — профиль текущего пользователя.
service UserService {
  // GetMe возвращает профиль пользователя из access-токена. При первом вызове
  // пользователь появляется в базе платформы.
  rpc GetMe(GetMeRequest) returns (GetMeResponse) {
    option (google.api.http) = {get: "/v1/me"};
  }
}

// Role — роль пользователя на платформе. Совпадает с realm roles в Keycloak.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Студент: решает задания и отправляет посылки.
  ROLE_STUDENT = 1;
  // Автор заданий: создаёт задания и тесты.
  ROLE_AUTHOR = 2;
  // Администратор платформы.
  ROLE_ADMIN = 3;
}

// User — профиль пользователя.
message User {
  // Идентификатор, совпадает с sub в токене Keycloak (UUID).
  string id = 1;
  // Email из Keycloak.
  string email = 2;
  // Отображаемое имя.
  string display_name = 3;
  // Все роли пользователя.
  repeated Role roles = 4;
}

// GetMeRequest — запрос профиля текущего пользователя.
message GetMeRequest {}

// GetMeResponse — профиль текущего пользователя.
message GetMeResponse {
  User user = 1;
}
