swagger: "2.0"
info:
  title: Autocheck API
  description: Автоматическая проверка программных решений студентов.
  version: "1.0"
tags:
  - name: UserService
    description: UserService — профиль текущего пользователя.
  - name: BillingService
    description: BillingService управляет оплатой доступа и показывает доступные квоты.
  - name: FeedbackService
    description: FeedbackService — запросы пользователей об изменениях платформы.
  - name: ProblemService
    description: ProblemService — задания, тест-кейсы и языки программирования.
  - name: SubmissionService
    description: 'SubmissionService — посылки: отправка решений и их результаты.'
  - name: TestGenerationService
    description: TestGenerationService — черновики тестов, доступные автору задания и администратору.
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/billing/yookassa/webhook:
    post:
      summary: YookassaWebhook принимает уведомление без JWT и проверяет платёж через API провайдера.
      operationId: BillingService_YookassaWebhook
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1YookassaWebhookResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: YookassaWebhookRequest использует только идентификатор, остальные поля недоверенные.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1YookassaWebhookRequest'
      tags:
        - BillingService
      security: []
  /v1/feedback-requests:
    get:
      summary: ListFeedbackRequests возвращает свои запросы, для администратора — все, новые первыми.
      operationId: FeedbackService_ListFeedbackRequests
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListFeedbackRequestsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: status
          description: |-
            Статус; UNSPECIFIED означает любой.

             - FEEDBACK_REQUEST_STATUS_UNSPECIFIED: Статус не указан; допустим только как отсутствие фильтра списка.
             - FEEDBACK_REQUEST_STATUS_NEW: Ожидает рассмотрения.
             - FEEDBACK_REQUEST_STATUS_ACCEPTED: Принят в работу.
             - FEEDBACK_REQUEST_STATUS_REJECTED: Отклонён; конечный статус.
             - FEEDBACK_REQUEST_STATUS_COMPLETED: Выполнен; конечный статус.
          in: query
          required: false
          type: string
          enum:
            - FEEDBACK_REQUEST_STATUS_UNSPECIFIED
            - FEEDBACK_REQUEST_STATUS_NEW
            - FEEDBACK_REQUEST_STATUS_ACCEPTED
            - FEEDBACK_REQUEST_STATUS_REJECTED
            - FEEDBACK_REQUEST_STATUS_COMPLETED
          default: FEEDBACK_REQUEST_STATUS_UNSPECIFIED
        - name: type
          description: |-
            Тип; UNSPECIFIED означает любой.

             - FEEDBACK_REQUEST_TYPE_UNSPECIFIED: Тип не указан; допустим только как отсутствие фильтра списка.
             - FEEDBACK_REQUEST_TYPE_COMPILER_UPDATE: Обновление компилятора или версии языка.
             - FEEDBACK_REQUEST_TYPE_NEW_LIBRARY: Добавление библиотеки.
             - FEEDBACK_REQUEST_TYPE_OTHER: Остальные предложения.
          in: query
          required: false
          type: string
          enum:
            - FEEDBACK_REQUEST_TYPE_UNSPECIFIED
            - FEEDBACK_REQUEST_TYPE_COMPILER_UPDATE
            - FEEDBACK_REQUEST_TYPE_NEW_LIBRARY
            - FEEDBACK_REQUEST_TYPE_OTHER
          default: FEEDBACK_REQUEST_TYPE_UNSPECIFIED
        - name: pageSize
          description: Размер страницы; 0 означает 20, максимум 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Непрозрачный токен следующей страницы; пусто для первой.
          in: query
          required: false
          type: string
      tags:
        - FeedbackService
    post:
      summary: CreateFeedbackRequest создаёт запрос от имени вошедшего пользователя.
      operationId: FeedbackService_CreateFeedbackRequest
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateFeedbackRequestResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: CreateFeedbackRequestRequest — создание запроса.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CreateFeedbackRequestRequest'
      tags:
        - FeedbackService
  /v1/feedback-requests/{id}:
    get:
      summary: GetFeedbackRequest возвращает свой запрос или любой для администратора.
      operationId: FeedbackService_GetFeedbackRequest
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetFeedbackRequestResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор (UUID).
          in: path
          required: true
          type: string
      tags:
        - FeedbackService
    patch:
      summary: |-
        UpdateFeedbackRequest меняет статус и комментарий; доступен только администратору.
        Новый запрос можно принять или отклонить, принятый — выполнить или отклонить.
        Повтор текущего статуса позволяет исправить комментарий, включая его очистку.
      operationId: FeedbackService_UpdateFeedbackRequest
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateFeedbackRequestResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор (UUID).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/FeedbackServiceUpdateFeedbackRequestBody'
      tags:
        - FeedbackService
  /v1/languages:
    get:
      summary: ListLanguages возвращает доступные языки программирования.
      operationId: ProblemService_ListLanguages
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListLanguagesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - ProblemService
  /v1/me:
    get:
      summary: |-
        GetMe возвращает профиль пользователя из access-токена. При первом вызове
        пользователь появляется в базе платформы.
      operationId: UserService_GetMe
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetMeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - UserService
  /v1/payments/me:
    get:
      summary: ListMyPayments возвращает платежи только текущего пользователя.
      operationId: BillingService_ListMyPayments
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListMyPaymentsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: Размер страницы, по умолчанию 20, максимум 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Непрозрачный токен предыдущей страницы.
          in: query
          required: false
          type: string
      tags:
        - BillingService
  /v1/plans:
    get:
      summary: ListPlans возвращает публичный каталог тарифов.
      operationId: BillingService_ListPlans
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListPlansResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - BillingService
      security: []
  /v1/problems:
    get:
      summary: |-
        ListProblems возвращает задания, новые первыми. Студенты видят опубликованные,
        авторы — опубликованные и свои, администраторы — все.
      operationId: ProblemService_ListProblems
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListProblemsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: pageSize
          description: Размер страницы, по умолчанию 20, не больше 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Токен страницы из next_page_token предыдущего ответа.
          in: query
          required: false
          type: string
        - name: onlyMine
          description: Только задания текущего пользователя (для авторов).
          in: query
          required: false
          type: boolean
      tags:
        - ProblemService
    post:
      summary: |-
        CreateProblem создаёт задание. Доступно авторам и администраторам.
        Новое задание не опубликовано.
      operationId: ProblemService_CreateProblem
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateProblemResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problem
          description: Задание. id, author_id, ready_test_count и время игнорируются.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1Problem'
      tags:
        - ProblemService
  /v1/problems/{id}:
    get:
      summary: GetProblem возвращает задание. Неопубликованное видят только автор и администратор.
      operationId: ProblemService_GetProblem
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetProblemResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор задания (UUID).
          in: path
          required: true
          type: string
      tags:
        - ProblemService
    delete:
      summary: |-
        DeleteProblem удаляет задание вместе с тестами. Нельзя удалить задание,
        по которому уже есть посылки: его можно снять с публикации.
      operationId: ProblemService_DeleteProblem
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteProblemResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Идентификатор задания (UUID).
          in: path
          required: true
          type: string
      tags:
        - ProblemService
  /v1/problems/{problem.id}:
    patch:
      summary: |-
        UpdateProblem меняет поля из update_mask. Доступно автору задания и администратору.
        Опубликовать можно только задание хотя бы с одним загруженным тестом.
      operationId: ProblemService_UpdateProblem
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1UpdateProblemResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problem.id
          description: Идентификатор (UUID).
          in: path
          required: true
          type: string
        - name: problem
          description: |-
            Задание с новыми значениями; id обязателен. Правила Problem проверяются
            сервисом для итогового задания после применения update_mask, а не здесь:
            в запросе заполнены только изменяемые поля.
          in: body
          required: true
          schema:
            type: object
            properties:
              authorId:
                type: string
                description: Автор задания (UUID пользователя).
                readOnly: true
              slug:
                type: string
                description: 'Короткий адрес для URL: строчные латинские буквы, цифры и дефисы.'
              title:
                type: string
                description: Название.
              statement:
                type: string
                description: Условие в Markdown.
              timeLimitMs:
                type: integer
                format: int32
                description: Ограничение времени на один тест, миллисекунды.
              memoryLimitKb:
                type: integer
                format: int32
                description: Ограничение памяти, килобайты (от 4 МБ до 2 ГБ).
              checker:
                $ref: '#/definitions/v1Checker'
                description: Способ проверки вывода.
              floatEpsilon:
                type: number
                format: double
                description: Допустимая погрешность для CHECKER_FLOAT.
              languageIds:
                type: array
                items:
                  type: string
                description: Языки, на которых можно сдавать решение.
              allowAiHints:
                type: boolean
                description: Разрешены ли ИИ-подсказки к заданию.
              isPublished:
                type: boolean
                description: Опубликовано ли задание (видно студентам).
              readyTestCount:
                type: integer
                format: int32
                description: Число загруженных и подтверждённых тестов.
                readOnly: true
              createTime:
                type: string
                format: date-time
                description: Время создания.
                readOnly: true
              stopOnFirstFailure:
                type: boolean
                description: Остановиться после первого непройденного теста.
              updateTime:
                type: string
                format: date-time
                description: Время последнего изменения.
                readOnly: true
            description: |-
              Задание с новыми значениями; id обязателен. Правила Problem проверяются
              сервисом для итогового задания после применения update_mask, а не здесь:
              в запросе заполнены только изменяемые поля.
      tags:
        - ProblemService
  /v1/problems/{problemId}/checker:confirm:
    post:
      summary: ConfirmChecker проверяет существование загруженного скрипта.
      operationId: ProblemService_ConfirmChecker
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ConfirmCheckerResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProblemServiceConfirmCheckerBody'
      tags:
        - ProblemService
  /v1/problems/{problemId}/checker:upload:
    post:
      summary: GetCheckerUpload выдаёт автору ссылку для загрузки Python-чекера.
      operationId: ProblemService_GetCheckerUpload
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetCheckerUploadResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProblemServiceGetCheckerUploadBody'
      tags:
        - ProblemService
  /v1/problems/{problemId}/submissions:
    post:
      summary: |-
        CreateSubmission отправляет решение на проверку. Задание должно быть опубликовано
        (автор может отправлять решения к своему черновику), язык — разрешён в задании.
        Повтор запроса с тем же client_request_id возвращает уже созданную посылку.
      operationId: SubmissionService_CreateSubmission
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateSubmissionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: Задание (UUID).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/SubmissionServiceCreateSubmissionBody'
      tags:
        - SubmissionService
  /v1/problems/{problemId}/test-cases:
    get:
      summary: |-
        ListTestCases возвращает тесты задания со ссылками на скачивание. Автор и
        администратор видят все тесты, остальные — только открытые тесты опубликованного задания.
      operationId: ProblemService_ListTestCases
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListTestCasesResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: Задание (UUID).
          in: path
          required: true
          type: string
      tags:
        - ProblemService
    post:
      summary: |-
        CreateTestCase создаёт тест и возвращает ссылки для загрузки входных и эталонных
        данных напрямую в объектное хранилище (HTTP PUT). После загрузки нужно вызвать
        ConfirmTestCase. Доступно автору задания и администратору.
      operationId: ProblemService_CreateTestCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateTestCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: Задание (UUID).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProblemServiceCreateTestCaseBody'
      tags:
        - ProblemService
  /v1/problems/{problemId}/test-cases/{id}:
    delete:
      summary: DeleteTestCase удаляет тест. Доступно автору задания и администратору.
      operationId: ProblemService_DeleteTestCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1DeleteTestCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: Задание (UUID).
          in: path
          required: true
          type: string
        - name: id
          description: Тест (UUID).
          in: path
          required: true
          type: string
      tags:
        - ProblemService
  /v1/problems/{problemId}/test-cases/{id}:confirm:
    post:
      summary: ConfirmTestCase проверяет, что оба файла загружены, и включает тест в проверку.
      operationId: ProblemService_ConfirmTestCase
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ConfirmTestCaseResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: Задание (UUID).
          in: path
          required: true
          type: string
        - name: id
          description: Тест (UUID).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/ProblemServiceConfirmTestCaseBody'
      tags:
        - ProblemService
  /v1/problems/{problemId}/test-generations:
    post:
      summary: CreateTestGeneration резервирует дневную квоту Pro и запускает асинхронную генерацию.
      operationId: TestGenerationService_CreateTestGeneration
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateTestGenerationResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: UUID задания.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TestGenerationServiceCreateTestGenerationBody'
      tags:
        - TestGenerationService
  /v1/problems/{problemId}/test-generations/{id}:
    get:
      summary: GetTestGeneration возвращает состояние и результаты без исходника эталона.
      operationId: TestGenerationService_GetTestGeneration
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetTestGenerationResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: UUID задания.
          in: path
          required: true
          type: string
        - name: id
          description: UUID генерации.
          in: path
          required: true
          type: string
      tags:
        - TestGenerationService
  /v1/problems/{problemId}/test-generations/{id}:accept:
    post:
      summary: AcceptTestGeneration включает выбранные черновики в обычные закрытые тесты; повтор безопасен.
      operationId: TestGenerationService_AcceptTestGeneration
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1AcceptTestGenerationResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: UUID задания.
          in: path
          required: true
          type: string
        - name: id
          description: UUID завершённой генерации.
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/TestGenerationServiceAcceptTestGenerationBody'
      tags:
        - TestGenerationService
  /v1/submissions:
    get:
      summary: |-
        ListSubmissions возвращает посылки, новые первыми. Без problem_id — свои посылки.
        С problem_id автор задания и администратор видят посылки всех пользователей.
      operationId: SubmissionService_ListSubmissions
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListSubmissionsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: problemId
          description: Только посылки по этому заданию (UUID).
          in: query
          required: false
          type: string
        - name: pageSize
          description: Размер страницы, по умолчанию 20, не больше 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Токен страницы из next_page_token предыдущего ответа.
          in: query
          required: false
          type: string
      tags:
        - SubmissionService
  /v1/submissions/{id}:
    get:
      summary: |-
        GetSubmission возвращает посылку с результатами по тестам. Доступно автору посылки,
        автору задания и администратору.
      operationId: SubmissionService_GetSubmission
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetSubmissionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Посылка (UUID).
          in: path
          required: true
          type: string
      tags:
        - SubmissionService
  /v1/submissions/{id}/hints:
    get:
      summary: ListSubmissionHints возвращает историю с правами GetSubmission, независимо от тарифа.
      operationId: SubmissionService_ListSubmissionHints
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1ListSubmissionHintsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Посылка (UUID).
          in: path
          required: true
          type: string
        - name: pageSize
          description: Размер страницы, по умолчанию 20, максимум 100.
          in: query
          required: false
          type: integer
          format: int32
        - name: pageToken
          description: Непрозрачный токен предыдущей страницы.
          in: query
          required: false
          type: string
      tags:
        - SubmissionService
  /v1/submissions/{id}/report:
    get:
      summary: |-
        GetSubmissionReport возвращает отчёт; данные закрытых тестов не раскрываются.
        Права совпадают с GetSubmission.
      operationId: SubmissionService_GetSubmissionReport
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetSubmissionReportResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Посылка (UUID).
          in: path
          required: true
          type: string
      tags:
        - SubmissionService
  /v1/submissions/{id}/source:
    get:
      summary: GetSubmissionSource возвращает исходный код посылки.
      operationId: SubmissionService_GetSubmissionSource
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetSubmissionSourceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Посылка (UUID).
          in: path
          required: true
          type: string
      tags:
        - SubmissionService
  /v1/submissions/{id}:hint:
    post:
      summary: |-
        CreateSubmissionHint даёт одну подсказку к собственной завершённой посылке.
        Новая подсказка требует Pro и разрешения автора; повтор возвращает сохранённый ответ.
      operationId: SubmissionService_CreateSubmissionHint
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CreateSubmissionHintResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Посылка (UUID).
          in: path
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/SubmissionServiceCreateSubmissionHintBody'
      tags:
        - SubmissionService
  /v1/submissions/{id}:watch:
    get:
      summary: |-
        WatchSubmission сразу возвращает состояние и затем изменения до done/failed.
        Права совпадают с GetSubmission; через 10 минут требуется новое подключение.
      operationId: SubmissionService_WatchSubmission
      responses:
        "200":
          description: A successful response.(streaming responses)
          schema:
            type: object
            properties:
              result:
                $ref: '#/definitions/v1WatchSubmissionResponse'
              error:
                $ref: '#/definitions/rpcStatus'
            title: Stream result of v1WatchSubmissionResponse
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: id
          description: Посылка (UUID).
          in: path
          required: true
          type: string
      tags:
        - SubmissionService
  /v1/subscriptions/me:
    get:
      summary: GetMySubscription возвращает эффективный тариф и остатки текущего месяца UTC.
      operationId: BillingService_GetMySubscription
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1GetMySubscriptionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      tags:
        - BillingService
  /v1/subscriptions:checkout:
    post:
      summary: CheckoutSubscription создаёт оплату; повтор с тем же ключом возвращает тот же платёж.
      operationId: BillingService_CheckoutSubscription
      responses:
        "200":
          description: A successful response.
          schema:
            $ref: '#/definitions/v1CheckoutSubscriptionResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/rpcStatus'
      parameters:
        - name: body
          description: CheckoutSubscriptionRequest фиксирует намерение оплаты, чтобы повтор не списал деньги дважды.
          in: body
          required: true
          schema:
            $ref: '#/definitions/v1CheckoutSubscriptionRequest'
      tags:
        - BillingService
definitions:
  FeedbackServiceUpdateFeedbackRequestBody:
    type: object
    properties:
      status:
        $ref: '#/definitions/v1FeedbackRequestStatus'
        description: Новый статус; обязателен, переход проверяется сервисом.
      adminComment:
        type: string
        description: Комментарий до 5000 символов; пустое значение очищает комментарий.
    description: UpdateFeedbackRequestRequest — полная замена статуса и комментария администратором.
  ProblemServiceConfirmCheckerBody:
    type: object
    description: ConfirmCheckerRequest — подтверждение загрузки чекера.
  ProblemServiceConfirmTestCaseBody:
    type: object
    description: ConfirmTestCaseRequest — подтверждение загрузки файлов теста.
  ProblemServiceCreateTestCaseBody:
    type: object
    properties:
      isSample:
        type: boolean
        description: Открытый тест.
      points:
        type: integer
        format: int32
        description: Баллы за тест, по умолчанию 1.
    description: CreateTestCaseRequest — создание теста.
  ProblemServiceGetCheckerUploadBody:
    type: object
    description: GetCheckerUploadRequest — запрос загрузки чекера.
  SubmissionServiceCreateSubmissionBody:
    type: object
    properties:
      languageId:
        type: string
        description: Язык решения, одно из language_ids задания.
      source:
        type: string
        description: Исходный код, UTF-8, не больше 64 КБ.
      clientRequestId:
        type: string
        description: 'Ключ идемпотентности (UUID): повтор запроса с тем же ключом не создаёт новую посылку.'
    description: CreateSubmissionRequest — отправка решения.
  SubmissionServiceCreateSubmissionHintBody:
    type: object
    description: CreateSubmissionHintRequest — запрос подсказки, ключ повтора — сама посылка.
  TestGenerationServiceAcceptTestGenerationBody:
    type: object
    properties:
      testIds:
        type: array
        items:
          type: string
        description: UUID кандидатов; повтор выбора уже принятых безопасен.
    description: AcceptTestGenerationRequest — выбор пригодных кандидатов.
  TestGenerationServiceCreateTestGenerationBody:
    type: object
    properties:
      requestId:
        type: string
        description: UUID идемпотентности в пределах пользователя, обязателен.
      languageId:
        type: string
        description: Активный язык задания.
      source:
        type: string
        description: Исходник эталона UTF-8, не более 64 КиБ.
      testCount:
        type: integer
        format: int32
        description: Число кандидатов от 1 до 20.
      wishes:
        type: string
        description: Пожелания автора, пустое значение допустимо.
    description: CreateTestGenerationRequest — данные эталона автора и ограничения генерации.
  protobufAny:
    type: object
    properties:
      '@type':
        type: string
    additionalProperties: true
  rpcStatus:
    type: object
    properties:
      code:
        type: integer
        format: int32
      message:
        type: string
      details:
        type: array
        items:
          type: object
          $ref: '#/definitions/protobufAny'
  v1AcceptTestGenerationResponse:
    type: object
    properties:
      generation:
        $ref: '#/definitions/v1TestGeneration'
        description: Обновлённая генерация.
    description: AcceptTestGenerationResponse — состояние с принятыми кандидатами.
  v1Checker:
    type: string
    enum:
      - CHECKER_UNSPECIFIED
      - CHECKER_EXACT
      - CHECKER_TOKENS
      - CHECKER_FLOAT
      - CHECKER_CUSTOM
    default: CHECKER_UNSPECIFIED
    description: |-
      Checker — способ сравнения вывода решения с эталоном.

       - CHECKER_EXACT: Побайтовое совпадение.
       - CHECKER_TOKENS: Совпадение последовательности токенов, разделённых пробельными символами.
       - CHECKER_FLOAT: Как TOKENS, но числа сравниваются с погрешностью float_epsilon.
       - CHECKER_CUSTOM: Собственный Python-чекер автора задания.
  v1CheckoutSubscriptionRequest:
    type: object
    properties:
      planCode:
        type: string
        description: Код платного тарифа.
      returnUrl:
        type: string
        description: Абсолютный HTTP(S) адрес возврата после оплаты.
      requestId:
        type: string
        description: UUID запроса, повторять при сетевых ошибках.
    description: CheckoutSubscriptionRequest фиксирует намерение оплаты, чтобы повтор не списал деньги дважды.
  v1CheckoutSubscriptionResponse:
    type: object
    properties:
      payment:
        $ref: '#/definitions/v1Payment'
        description: Локальная запись оплаты.
      confirmationUrl:
        type: string
        description: Адрес ЮKassa для редиректа; пусто у завершённого платежа.
    description: CheckoutSubscriptionResponse содержит адрес страницы подтверждения оплаты.
  v1ConfirmCheckerResponse:
    type: object
    description: ConfirmCheckerResponse — чекер загружен.
  v1ConfirmTestCaseResponse:
    type: object
    properties:
      testCase:
        $ref: '#/definitions/v1TestCase'
    description: ConfirmTestCaseResponse — подтверждённый тест.
  v1CreateFeedbackRequestRequest:
    type: object
    properties:
      type:
        $ref: '#/definitions/v1FeedbackRequestType'
        description: Предмет запроса; обязателен.
      languageId:
        type: string
        description: Существующий язык, включая выключенный; отсутствие означает запрос без привязки.
      title:
        type: string
        description: Заголовок, от 1 до 200 символов; не может состоять только из пробелов.
      text:
        type: string
        description: Текст, от 1 до 10000 символов; не может состоять только из пробелов.
      clientRequestId:
        type: string
        description: |-
          Необязательный ключ идемпотентности (UUID), уникальный в пределах автора.
          Повтор возвращает первоначальный запрос, даже если содержимое изменилось.
    description: CreateFeedbackRequestRequest — создание запроса.
  v1CreateFeedbackRequestResponse:
    type: object
    properties:
      feedbackRequest:
        $ref: '#/definitions/v1FeedbackRequest'
        description: Сохранённый запрос.
    description: CreateFeedbackRequestResponse — созданный или ранее созданный запрос.
  v1CreateProblemResponse:
    type: object
    properties:
      problem:
        $ref: '#/definitions/v1Problem'
    description: CreateProblemResponse — созданное задание.
  v1CreateSubmissionHintResponse:
    type: object
    properties:
      hint:
        $ref: '#/definitions/v1SubmissionHint'
        description: Подсказка, доступная без повторного вызова модели.
    description: CreateSubmissionHintResponse — первоначальный ответ или его сохранённый повтор.
  v1CreateSubmissionResponse:
    type: object
    properties:
      submission:
        $ref: '#/definitions/v1Submission'
    description: CreateSubmissionResponse — созданная посылка.
  v1CreateTestCaseResponse:
    type: object
    properties:
      testCase:
        $ref: '#/definitions/v1TestCase'
      inputUploadUrl:
        type: string
        description: Ссылка для HTTP PUT входных данных.
      expectedUploadUrl:
        type: string
        description: Ссылка для HTTP PUT эталонного вывода.
      uploadExpireTime:
        type: string
        format: date-time
        description: До какого момента действуют ссылки.
    description: CreateTestCaseResponse — созданный тест и ссылки для загрузки файлов.
  v1CreateTestGenerationResponse:
    type: object
    properties:
      generation:
        $ref: '#/definitions/v1TestGeneration'
        description: Генерация в очереди либо результат повторного запроса.
    description: CreateTestGenerationResponse — сохранённая генерация.
  v1DeleteProblemResponse:
    type: object
    description: DeleteProblemResponse — ответ на удаление задания.
  v1DeleteTestCaseResponse:
    type: object
    description: DeleteTestCaseResponse — ответ на удаление теста.
  v1FeedbackRequest:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор запроса (UUID).
      userId:
        type: string
        description: Автор запроса (UUID).
      type:
        $ref: '#/definitions/v1FeedbackRequestType'
        description: Предмет запроса.
      languageId:
        type: string
        description: Связанный язык; пусто, если запрос не привязан к языку.
      title:
        type: string
        description: Заголовок, от 1 до 200 символов.
      text:
        type: string
        description: Текст, от 1 до 10000 символов.
      status:
        $ref: '#/definitions/v1FeedbackRequestStatus'
        description: Текущее состояние рассмотрения.
      adminComment:
        type: string
        description: Комментарий администратора, до 5000 символов; пусто, если комментария нет.
      createTime:
        type: string
        format: date-time
        description: Время создания.
      updateTime:
        type: string
        format: date-time
        description: Время последнего изменения.
    description: FeedbackRequest — запрос пользователя об изменениях платформы.
  v1FeedbackRequestStatus:
    type: string
    enum:
      - FEEDBACK_REQUEST_STATUS_UNSPECIFIED
      - FEEDBACK_REQUEST_STATUS_NEW
      - FEEDBACK_REQUEST_STATUS_ACCEPTED
      - FEEDBACK_REQUEST_STATUS_REJECTED
      - FEEDBACK_REQUEST_STATUS_COMPLETED
    default: FEEDBACK_REQUEST_STATUS_UNSPECIFIED
    description: |-
      FeedbackRequestStatus — состояние рассмотрения запроса.

       - FEEDBACK_REQUEST_STATUS_UNSPECIFIED: Статус не указан; допустим только как отсутствие фильтра списка.
       - FEEDBACK_REQUEST_STATUS_NEW: Ожидает рассмотрения.
       - FEEDBACK_REQUEST_STATUS_ACCEPTED: Принят в работу.
       - FEEDBACK_REQUEST_STATUS_REJECTED: Отклонён; конечный статус.
       - FEEDBACK_REQUEST_STATUS_COMPLETED: Выполнен; конечный статус.
  v1FeedbackRequestType:
    type: string
    enum:
      - FEEDBACK_REQUEST_TYPE_UNSPECIFIED
      - FEEDBACK_REQUEST_TYPE_COMPILER_UPDATE
      - FEEDBACK_REQUEST_TYPE_NEW_LIBRARY
      - FEEDBACK_REQUEST_TYPE_OTHER
    default: FEEDBACK_REQUEST_TYPE_UNSPECIFIED
    description: |-
      FeedbackRequestType — предмет запроса.

       - FEEDBACK_REQUEST_TYPE_UNSPECIFIED: Тип не указан; допустим только как отсутствие фильтра списка.
       - FEEDBACK_REQUEST_TYPE_COMPILER_UPDATE: Обновление компилятора или версии языка.
       - FEEDBACK_REQUEST_TYPE_NEW_LIBRARY: Добавление библиотеки.
       - FEEDBACK_REQUEST_TYPE_OTHER: Остальные предложения.
  v1GeneratedTest:
    type: object
    properties:
      id:
        type: string
        description: UUID кандидата, совпадает с UUID принятого test_case.
      input:
        type: string
        format: byte
        description: Вход, пустой у отклонённого кандидата.
      expected:
        type: string
        format: byte
        description: Вывод эталона, пустой у отклонённого кандидата.
      explanation:
        type: string
        description: Пояснение проверяемого случая.
      rejectionReason:
        type: string
        description: Безопасная причина отбрасывания, пустая у пригодного теста.
      isAccepted:
        type: boolean
        description: Кандидат уже включён в задание.
    description: GeneratedTest — один кандидат; вход и вывод возвращаются как bytes (base64 в REST).
  v1GetCheckerUploadResponse:
    type: object
    properties:
      uploadUrl:
        type: string
      uploadExpireTime:
        type: string
        format: date-time
    description: GetCheckerUploadResponse — ссылка для HTTP PUT.
  v1GetFeedbackRequestResponse:
    type: object
    properties:
      feedbackRequest:
        $ref: '#/definitions/v1FeedbackRequest'
        description: Запрос пользователя.
    description: GetFeedbackRequestResponse — доступный пользователю запрос.
  v1GetMeResponse:
    type: object
    properties:
      user:
        $ref: '#/definitions/v1User'
    description: GetMeResponse — профиль текущего пользователя.
  v1GetMySubscriptionResponse:
    type: object
    properties:
      plan:
        $ref: '#/definitions/v1Plan'
        description: Эффективный тариф.
      status:
        type: string
        description: active, expired или free, если оплаты ещё не было.
      startTime:
        type: string
        format: date-time
        description: Начало оплаченного доступа, отсутствует без подписки.
      endTime:
        type: string
        format: date-time
        description: Конец оплаченного доступа, отсутствует без подписки.
      testRunsUsed:
        type: string
        format: int64
        description: Число сохранённых прогонов за текущий месяц UTC.
      testRunsRemaining:
        type: string
        format: int64
        description: Остаток за вычетом прогонов и резерва очереди; -1 — без ограничения.
      compilationsRemaining:
        type: string
        format: int64
        description: Остаток компиляций в текущем окне; -1 — без ограничения.
      compilationRetryAfterSeconds:
        type: string
        format: int64
        description: Число секунд до следующей доступной компиляции; ноль — уже доступна.
      checkoutEnabled:
        type: boolean
        description: Доступно ли оформление оплаты в этом окружении.
    description: GetMySubscriptionResponse показывает эффективный тариф; после истечения действует free.
  v1GetProblemResponse:
    type: object
    properties:
      problem:
        $ref: '#/definitions/v1Problem'
    description: GetProblemResponse — задание.
  v1GetSubmissionReportResponse:
    type: object
    properties:
      languageId:
        type: string
        description: Идентификатор языка решения.
      status:
        $ref: '#/definitions/v1SubmissionStatus'
        description: Текущий этап проверки.
      verdict:
        $ref: '#/definitions/v1Verdict'
        description: Итоговый вердикт; UNSPECIFIED до завершения.
      score:
        type: integer
        format: int32
        description: Набранные баллы; отсутствуют до расчёта.
      compileLog:
        type: string
        description: Лог компиляции только при CE, до 64 КиБ.
      testRuns:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubmissionTestReport'
        description: Выполненные тесты в порядке ordinal.
    description: GetSubmissionReportResponse — отчёт, до завершения проверки может быть неполным.
  v1GetSubmissionResponse:
    type: object
    properties:
      submission:
        $ref: '#/definitions/v1Submission'
      testRuns:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1TestRun'
        description: Результаты по тестам в порядке тестов. Пусто, пока тесты не запускались.
        readOnly: true
    description: GetSubmissionResponse — посылка и результаты по тестам.
  v1GetSubmissionSourceResponse:
    type: object
    properties:
      languageId:
        type: string
        description: Язык решения.
      fileName:
        type: string
        description: Имя файла с исходником в песочнице, например "main.go".
      source:
        type: string
        description: Исходный код.
    description: GetSubmissionSourceResponse — исходный код посылки.
  v1GetTestGenerationResponse:
    type: object
    properties:
      generation:
        $ref: '#/definitions/v1TestGeneration'
        description: Генерация с черновиками и причинами отказов.
    description: GetTestGenerationResponse — актуальное состояние.
  v1Language:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор, например "go1.27", "cpp20-gcc15".
      name:
        type: string
        description: Название для интерфейса, например "Go 1.27".
    description: Language — язык программирования и его тулчейн.
  v1ListFeedbackRequestsResponse:
    type: object
    properties:
      feedbackRequests:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1FeedbackRequest'
        description: Запросы, новые первыми.
      nextPageToken:
        type: string
        description: Токен следующей страницы; пусто для последней.
    description: ListFeedbackRequestsResponse — страница запросов.
  v1ListLanguagesResponse:
    type: object
    properties:
      languages:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Language'
    description: ListLanguagesResponse — доступные языки.
  v1ListMyPaymentsResponse:
    type: object
    properties:
      payments:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Payment'
        description: Платежи текущего пользователя.
      nextPageToken:
        type: string
        description: Пусто на последней странице.
    description: ListMyPaymentsResponse возвращает страницу от новых платежей к старым.
  v1ListPlansResponse:
    type: object
    properties:
      plans:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Plan'
        description: Каталог тарифов.
    description: ListPlansResponse содержит доступные тарифы.
  v1ListProblemsResponse:
    type: object
    properties:
      problems:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Problem'
      nextPageToken:
        type: string
        description: Токен следующей страницы; пустой, если это последняя страница.
    description: ListProblemsResponse — страница заданий.
  v1ListSubmissionHintsResponse:
    type: object
    properties:
      hints:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1SubmissionHint'
        description: Готовые подсказки; незавершённая генерация не показывается.
      nextPageToken:
        type: string
        description: Токен продолжения; пусто для текущей истории из одной записи.
    description: 'ListSubmissionHintsResponse — история: сейчас не больше одной подсказки на посылку.'
  v1ListSubmissionsResponse:
    type: object
    properties:
      submissions:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1Submission'
      nextPageToken:
        type: string
        description: Токен следующей страницы; пустой, если это последняя страница.
    description: ListSubmissionsResponse — страница посылок.
  v1ListTestCasesResponse:
    type: object
    properties:
      testCases:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1TestCase'
    description: ListTestCasesResponse — тесты задания по порядку.
  v1Payment:
    type: object
    properties:
      id:
        type: string
        description: Наш UUID платежа.
      planCode:
        type: string
        description: Код купленного тарифа.
      amountKopecks:
        type: string
        format: int64
        description: Зафиксированная при оформлении сумма в копейках.
      status:
        type: string
        description: pending, succeeded или canceled.
      createTime:
        type: string
        format: date-time
        description: Момент создания записи.
    description: Payment не содержит ключей доступа или платёжных реквизитов.
  v1Plan:
    type: object
    properties:
      code:
        type: string
        description: Стабильный код тарифа.
      name:
        type: string
        description: Название для пользователя.
      amountKopecks:
        type: string
        format: int64
        description: Цена в копейках.
      periodDays:
        type: integer
        format: int32
        description: Продолжительность оплаченного периода в днях.
      compilationLimit:
        type: integer
        format: int32
        description: Число компиляций в скользящем окне; ноль — без ограничения.
      compilationWindowSeconds:
        type: integer
        format: int32
        description: Длительность скользящего окна в секундах.
      monthlyTestRunLimit:
        type: integer
        format: int32
        description: Число прогонов за календарный месяц UTC; ноль — без ограничения.
      dailyTestGenerationLimit:
        type: integer
        format: int32
        description: Максимум генераций за календарные сутки UTC; ноль запрещает генерации.
      dailyAiHintLimit:
        type: integer
        format: int32
        description: Максимум новых подсказок за календарные сутки UTC; ноль запрещает подсказки.
    description: Plan содержит цену в копейках и ограничения; смысл нуля указан у каждого лимита.
  v1Problem:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор (UUID).
        readOnly: true
      authorId:
        type: string
        description: Автор задания (UUID пользователя).
        readOnly: true
      slug:
        type: string
        description: 'Короткий адрес для URL: строчные латинские буквы, цифры и дефисы.'
      title:
        type: string
        description: Название.
      statement:
        type: string
        description: Условие в Markdown.
      timeLimitMs:
        type: integer
        format: int32
        description: Ограничение времени на один тест, миллисекунды.
      memoryLimitKb:
        type: integer
        format: int32
        description: Ограничение памяти, килобайты (от 4 МБ до 2 ГБ).
      checker:
        $ref: '#/definitions/v1Checker'
        description: Способ проверки вывода.
      floatEpsilon:
        type: number
        format: double
        description: Допустимая погрешность для CHECKER_FLOAT.
      languageIds:
        type: array
        items:
          type: string
        description: Языки, на которых можно сдавать решение.
      allowAiHints:
        type: boolean
        description: Разрешены ли ИИ-подсказки к заданию.
      isPublished:
        type: boolean
        description: Опубликовано ли задание (видно студентам).
      readyTestCount:
        type: integer
        format: int32
        description: Число загруженных и подтверждённых тестов.
        readOnly: true
      createTime:
        type: string
        format: date-time
        description: Время создания.
        readOnly: true
      stopOnFirstFailure:
        type: boolean
        description: Остановиться после первого непройденного теста.
      updateTime:
        type: string
        format: date-time
        description: Время последнего изменения.
        readOnly: true
    description: Problem — задание.
  v1ReportText:
    type: object
    properties:
      text:
        type: string
        description: До 4096 байт UTF-8; невалидные последовательности заменяются на U+FFFD.
      isTruncated:
        type: boolean
        description: Исходный объект не поместился полностью.
    description: ReportText — текстовый префикс объекта с ограничением объёма.
  v1Role:
    type: string
    enum:
      - ROLE_UNSPECIFIED
      - ROLE_STUDENT
      - ROLE_AUTHOR
      - ROLE_ADMIN
    default: ROLE_UNSPECIFIED
    description: |-
      Role — роль пользователя на платформе. Совпадает с realm roles в Keycloak.

       - ROLE_STUDENT: Студент: решает задания и отправляет посылки.
       - ROLE_AUTHOR: Автор заданий: создаёт задания и тесты.
       - ROLE_ADMIN: Администратор платформы.
  v1Submission:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор (UUID).
      problemId:
        type: string
        description: Задание (UUID).
      userId:
        type: string
        description: Автор посылки (UUID).
      languageId:
        type: string
        description: Язык решения.
      sourceSizeBytes:
        type: integer
        format: int32
        description: Размер исходного кода, байты.
      status:
        $ref: '#/definitions/v1SubmissionStatus'
        description: Этап проверки.
      verdict:
        $ref: '#/definitions/v1Verdict'
        description: Итоговый вердикт; VERDICT_UNSPECIFIED, пока проверка не завершена.
      score:
        type: integer
        format: int32
        description: Набранные баллы; пусто, пока проверка не завершена.
      maxTimeMs:
        type: integer
        format: int32
        description: Максимальное время на одном тесте, миллисекунды.
      maxMemoryKb:
        type: integer
        format: int32
        description: Максимальная память на одном тесте, килобайты.
      compileLog:
        type: string
        description: Вывод компилятора при ошибке компиляции.
      createTime:
        type: string
        format: date-time
        description: Время отправки.
      startTime:
        type: string
        format: date-time
        description: Начало проверки.
      finishTime:
        type: string
        format: date-time
        description: Конец проверки.
    description: Submission — посылка.
  v1SubmissionHint:
    type: object
    properties:
      id:
        type: string
        format: int64
        description: Идентификатор записи истории.
      text:
        type: string
        description: Текст на русском языке, не больше 1000 символов.
      isFallback:
        type: boolean
        description: Модель дважды выдала небезопасный ответ; возвращена общая подсказка.
      createTime:
        type: string
        format: date-time
        description: Время сохранения подсказки.
    description: SubmissionHint — сохранённая наводящая подсказка без кода решения.
  v1SubmissionStatus:
    type: string
    enum:
      - SUBMISSION_STATUS_UNSPECIFIED
      - SUBMISSION_STATUS_QUEUED
      - SUBMISSION_STATUS_COMPILING
      - SUBMISSION_STATUS_RUNNING
      - SUBMISSION_STATUS_DONE
      - SUBMISSION_STATUS_FAILED
    default: SUBMISSION_STATUS_UNSPECIFIED
    description: |-
      SubmissionStatus — этап проверки посылки.

       - SUBMISSION_STATUS_QUEUED: В очереди на проверку.
       - SUBMISSION_STATUS_COMPILING: Компилируется.
       - SUBMISSION_STATUS_RUNNING: Выполняются тесты.
       - SUBMISSION_STATUS_DONE: Проверка завершена, вердикт известен.
       - SUBMISSION_STATUS_FAILED: Сбой проверяющей системы (вердикт SE), посылку можно перепроверить.
  v1SubmissionTestReport:
    type: object
    properties:
      ordinal:
        type: integer
        format: int32
        description: Порядковый номер теста.
      isSample:
        type: boolean
        description: Признак открытого теста.
      verdict:
        $ref: '#/definitions/v1Verdict'
        description: Вердикт теста.
      timeMs:
        type: integer
        format: int32
        description: Время выполнения, миллисекунды.
      memoryKb:
        type: integer
        format: int32
        description: Пик памяти, килобайты.
      cpuTimeMs:
        type: integer
        format: int32
        description: Приблизительное CPU-время, миллисекунды.
      isTimeLimitExceeded:
        type: boolean
        description: Превышено время (TL).
      isMemoryLimitExceeded:
        type: boolean
        description: Превышена память (ML).
      input:
        $ref: '#/definitions/v1ReportText'
        description: Вход только открытого теста с WA; иначе отсутствует.
      expectedOutput:
        $ref: '#/definitions/v1ReportText'
        description: Эталон только открытого теста с WA; иначе отсутствует.
      actualOutput:
        $ref: '#/definitions/v1ReportText'
        description: Фактический вывод только открытого теста с WA; отсутствует у старых прогонов без stdout.
      diff:
        type: string
        description: |-
          Построчный diff показанных префиксов: пробел = совпадение, минус = эталон, плюс = вывод.
          Сохраняет CR и различие завершающего LF; пусто без сохранённого stdout.
    description: SubmissionTestReport — результат и безопасные пояснения по тесту.
  v1TestCase:
    type: object
    properties:
      isGenerated:
        type: boolean
        description: Тест получен генерацией и явно принят автором.
      id:
        type: string
        description: Идентификатор (UUID).
      problemId:
        type: string
        description: Задание (UUID).
      ordinal:
        type: integer
        format: int32
        description: Порядковый номер теста в задании, начиная с 1.
      isSample:
        type: boolean
        description: 'Открытый тест: студент видит вход, эталон и diff своего вывода.'
      points:
        type: integer
        format: int32
        description: Баллы за прохождение теста.
      isReady:
        type: boolean
        description: Оба файла загружены и тест участвует в проверке.
      inputSizeBytes:
        type: string
        format: int64
        description: Размер входных данных, байты. 0, пока тест не подтверждён.
      expectedSizeBytes:
        type: string
        format: int64
        description: Размер эталонного вывода, байты. 0, пока тест не подтверждён.
      inputDownloadUrl:
        type: string
        description: Временная ссылка на скачивание входных данных. Пустая, если тест не загружен.
      expectedDownloadUrl:
        type: string
        description: Временная ссылка на скачивание эталонного вывода. Пустая, если тест не загружен.
    description: TestCase — тест задания.
  v1TestGeneration:
    type: object
    properties:
      id:
        type: string
        description: UUID генерации.
      problemId:
        type: string
        description: UUID задания.
      status:
        $ref: '#/definitions/v1TestGenerationStatus'
        description: Этап обработки.
      tests:
        type: array
        items:
          type: object
          $ref: '#/definitions/v1GeneratedTest'
        description: Кандидаты в порядке генерации.
      error:
        type: string
        description: Безопасная причина общей ошибки, без ответа LLM или исходника.
      createTime:
        type: string
        format: date-time
        description: Время постановки в очередь.
      updateTime:
        type: string
        format: date-time
        description: Время последнего изменения.
    description: TestGeneration — состояние генерации, максимум 20 кандидатов.
  v1TestGenerationStatus:
    type: string
    enum:
      - TEST_GENERATION_STATUS_UNSPECIFIED
      - TEST_GENERATION_STATUS_QUEUED
      - TEST_GENERATION_STATUS_RUNNING
      - TEST_GENERATION_STATUS_DONE
      - TEST_GENERATION_STATUS_FAILED
    default: TEST_GENERATION_STATUS_UNSPECIFIED
    description: |-
      TestGenerationStatus — этап обработки.

       - TEST_GENERATION_STATUS_UNSPECIFIED: Не задан.
       - TEST_GENERATION_STATUS_QUEUED: Ожидает воркера.
       - TEST_GENERATION_STATUS_RUNNING: LLM и песочница обрабатывают задание.
       - TEST_GENERATION_STATUS_DONE: Черновики готовы, включая возможные отказы отдельных входов.
       - TEST_GENERATION_STATUS_FAILED: Обработка завершилась ошибкой.
  v1TestRun:
    type: object
    properties:
      testCaseId:
        type: string
        description: Тест (UUID).
      ordinal:
        type: integer
        format: int32
        description: Порядковый номер теста в задании.
      isSample:
        type: boolean
        description: Открытый ли тест.
      verdict:
        $ref: '#/definitions/v1Verdict'
        description: Вердикт на тесте.
      timeMs:
        type: integer
        format: int32
        description: Время работы, миллисекунды.
      memoryKb:
        type: integer
        format: int32
        description: Пиковая память, килобайты.
      cpuTimeMs:
        type: integer
        format: int32
        description: Приблизительное CPU-время контейнера, миллисекунды.
      stderrTail:
        type: string
        description: Хвост stderr только открытого теста.
    description: TestRun — результат посылки на одном тесте.
  v1UpdateFeedbackRequestResponse:
    type: object
    properties:
      feedbackRequest:
        $ref: '#/definitions/v1FeedbackRequest'
        description: Состояние после изменения.
    description: UpdateFeedbackRequestResponse — изменённый запрос.
  v1UpdateProblemResponse:
    type: object
    properties:
      problem:
        $ref: '#/definitions/v1Problem'
    description: UpdateProblemResponse — изменённое задание.
  v1User:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор, совпадает с sub в токене Keycloak (UUID).
      email:
        type: string
        description: Email из Keycloak.
      displayName:
        type: string
        description: Отображаемое имя.
      roles:
        type: array
        items:
          $ref: '#/definitions/v1Role'
        description: Все роли пользователя.
    description: User — профиль пользователя.
  v1Verdict:
    type: string
    enum:
      - VERDICT_UNSPECIFIED
      - VERDICT_OK
      - VERDICT_COMPILATION_ERROR
      - VERDICT_WRONG_ANSWER
      - VERDICT_TIME_LIMIT_EXCEEDED
      - VERDICT_MEMORY_LIMIT_EXCEEDED
      - VERDICT_RUNTIME_ERROR
      - VERDICT_SYSTEM_ERROR
    default: VERDICT_UNSPECIFIED
    description: |-
      Verdict — результат проверки посылки или одного теста.

       - VERDICT_OK: Принято.
       - VERDICT_COMPILATION_ERROR: Ошибка компиляции.
       - VERDICT_WRONG_ANSWER: Неверный ответ.
       - VERDICT_TIME_LIMIT_EXCEEDED: Превышено ограничение времени.
       - VERDICT_MEMORY_LIMIT_EXCEEDED: Превышено ограничение памяти.
       - VERDICT_RUNTIME_ERROR: Ошибка выполнения (ненулевой код возврата, падение).
       - VERDICT_SYSTEM_ERROR: Сбой проверяющей системы, не вина решения.
  v1WatchSubmissionResponse:
    type: object
    properties:
      submission:
        $ref: '#/definitions/v1Submission'
        description: Состояние посылки на момент чтения БД.
    description: WatchSubmissionResponse — актуальное состояние, а не журнал переходов.
  v1YookassaWebhookObject:
    type: object
    properties:
      id:
        type: string
        description: Идентификатор платежа ЮKassa.
    description: YookassaWebhookObject выделяет только идентификатор из объекта провайдера.
  v1YookassaWebhookRequest:
    type: object
    properties:
      type:
        type: string
        description: Тип уведомления провайдера.
      event:
        type: string
        description: Имя события; не служит доказательством оплаты.
      object:
        $ref: '#/definitions/v1YookassaWebhookObject'
        description: Минимальное представление объекта оплаты.
    description: YookassaWebhookRequest использует только идентификатор, остальные поля недоверенные.
  v1YookassaWebhookResponse:
    type: object
    description: YookassaWebhookResponse подтверждает обработку уведомления.
securityDefinitions:
  bearer:
    type: apiKey
    description: 'Access-токен Keycloak: `Bearer <token>`'
    name: Authorization
    in: header
security:
  - bearer: []
