version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/autocheck-team/backend/pkg/api
  disable:
    - module: buf.build/googleapis/googleapis
    - module: buf.build/bufbuild/protovalidate
    - module: buf.build/grpc-ecosystem/grpc-gateway
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: pkg/api
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: pkg/api
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.32.0
    out: pkg/api
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/openapiv2:v2.32.0
    out: api/openapi
    opt:
      - allow_merge=true
      - merge_file_name=autocheck
      - output_format=yaml
      - disable_default_errors=false
